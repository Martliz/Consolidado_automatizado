<!DOCTYPE html>\n<html lang='en'>\n<head>\n    <meta charset='UTF-8'>\n    <meta name='viewport' content='width=device-width, initial-scale=1.0'>\n    <title>Data from Google Sheets</title>\n    <link rel='stylesheet' href='https://cdn.datatables.net/1.10.21/css/jquery.dataTables.min.css'>\n    <style>\n        th.highlight { background-color: yellow; }\n    </style>\n</head>\n<body>\n    <h1>Data from Google Sheets</h1>\n    <label for='familia'>Filter by Familia:</label>\n    <select id='familia'><option value=''>All</option></select>\n    <label for='subfamilia'>Filter by Subfamilia:</label>\n    <select id='subfamilia'><option value=''>All</option></select>\n    <input type='text' id='search' placeholder='Search...'>\n    <table id='data-table'>\n        <thead>\n            <tr>\n                <th>Id</th>\n                <th>Numero</th>\n                <th>Familia</th>\n                <th>Subfamilia</th>\n                <th>Cuando Aplica</th>\n                <th>Tipo</th>\n                <th>Manual Ficha</th>\n                <th class='highlight'>Tipificacion</th>\n                <th>Causa Reclamo</th>\n                <th>Proceso Resolucion</th>\n                <th>Script RRSS</th>\n                <th>Tiene Wizard</th>\n            </tr>\n        </thead>\n        <tbody>\n            <!-- Data will be populated here -->\n        </tbody>\n    </table>\n    <script src='https://code.jquery.com/jquery-3.5.1.js'></script>\n    <script src='https://cdn.datatables.net/1.10.21/js/jquery.dataTables.min.js'></script>\n    <script>\n        $(document).ready(function() {\n            var table = $('#data-table').DataTable();\n            $('#search').on('keyup', function() {\n                table.search(this.value).draw();\n            });\n            $('#familia, #subfamilia').on('change', function() {\n                table.column($(this).data('column-index')).search(this.value).draw();\n            });\n\n            // Load Google Sheets data here\n            var sheetId = '1QQyCy8Ixf8-JGXSll64980E3G_b8p04bGIDbhEuWpWM';\n            var sheetName = 'causas_sheets.csv';\n            var url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${sheetName}?key=YOUR_API_KEY`;\n            $.get(url, function(data) {\n                var rows = data.values;\n                for (var i = 1; i < rows.length; i++) {\n                    table.row.add(rows[i]).draw();\n                }\n                // Populate filter options\n                populateFilters(rows);\n            });\n\n            function populateFilters(data) {\n                var familiaSet = new Set();\n                var subfamiliaSet = new Set();\n                data.forEach(function(row) {\n                    familiaSet.add(row[2]); // Index for 'familia'\n                    subfamiliaSet.add(row[3]); // Index for 'subfamilia'\n                });\n                familiaSet.forEach(function(f) {\n                    $('#familia').append(new Option(f, f));\n                });\n                subfamiliaSet.forEach(function(sf) {\n                    $('#subfamilia').append(new Option(sf, sf));\n                });\n            }\n        });\n    </script>\n</body>\n</html>
