<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Service Manager Interface</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Customer Service Manager</h1>
        <form id="case-form">
            <label for="executive">Executive:</label>
            <input type="text" id="executive" name="executive" required>
            <label for="client">Client:</label>
            <input type="text" id="client" name="client" required>
            <label for="case-number">Case Number:</label>
            <input type="text" id="case-number" name="case-number" required>
            <div>
                <input type="radio" id="morning" name="time" value="morning">
                <label for="morning">Morning</label>
                <input type="radio" id="afternoon" name="time" value="afternoon">
                <label for="afternoon">Afternoon</label>
            </div>
        </form>
    </header>
    <main>
        <section id="questionnaire">
            <h2>Questionnaire</h2>
            <label for="contact-type">Contact Type:</label>
            <select id="contact-type" name="contact-type">
                <option value="phone">Phone</option>
                <option value="email">Email</option>
                <option value="chat">Chat</option>
            </select>
            <label for="request-type">Request Type:</label>
            <select id="request-type" name="request-type">
                <option value="information">Information</option>
                <option value="support">Support</option>
                <option value="complaint">Complaint</option>
            </select>
            <label for="cause">Cause:</label>
            <select id="cause" name="cause">
                <option value="technical">Technical Issue</option>
                <option value="billing">Billing Issue</option>
                <option value="service">Service Inquiry</option>
            </select>
        </section>
        <aside>
            <div id="conditions-panel">
                <h2>Conditions</h2>
                <p>Here you can inform about conditions...</p>
            </div>
            <div id="scripts-panel">
                <h2>Scripts</h2>
                <textarea placeholder="Empathy Phrases..."></textarea>
                <textarea placeholder="Containment Messages..."></textarea>
            </div>
        </aside>
    </main>
    <footer>
        <button type="submit" form="case-form">Submit</button>
    </footer>
</body>
</html>
